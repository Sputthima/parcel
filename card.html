<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>บัตรรับพัสดุ</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
           background: #f5f5f5; margin: 0; padding: 24px 16px; text-align: center; color: #222; }
    .card { background: #fff; border-radius: 16px; padding: 24px; max-width: 380px;
            margin: 0 auto; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h2 { margin-top: 0; color: #06c755; }
    p { line-height: 1.5; }
    input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ddd;
            border-radius: 8px; margin-bottom: 10px; outline: none; }
    input:focus { border-color: #06c755; }
    #qrcode { margin: 20px auto; display: flex; justify-content: center; }
    .loading { color: #777; margin: 40px auto; max-width: 380px; }
    .loading-spinner { width: 36px; height: 36px; margin: 0 auto 16px; border: 4px solid #e5e5e5;
                       border-top-color: #06c755; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { display: block; background: #fff0f0; border: 1px solid #ffc5c5; color: #c00;
             padding: 16px; border-radius: 10px; text-align: left; word-break: break-word; }
    .subtext { color: #888; font-size: 13px; }
    .debug { margin-top: 12px; font-size: 11px; color: #aaa; word-break: break-all; }
    .btn { width: 100%; max-width: 320px; margin: 6px auto 0; padding: 14px; font-size: 16px;
           font-weight: 600; border: none; border-radius: 10px; background: #06c755;
           color: #fff; cursor: pointer; }
    .btn:active { opacity: .85; }
    .field-label { text-align: left; font-size: 13px; color: #555; margin: 2px 0 4px; }
  </style>
</head>
<body>

  <div id="loading" class="loading">
    <div class="loading-spinner"></div>
    <div id="loadingText">กำลังเชื่อมต่อ LINE...</div>
    <div id="debugInfo" class="debug"></div>
  </div>

  <!-- หน้าลงทะเบียน (พนักงานกรอกเอง) -->
  <div id="registerView" class="card" style="display:none;">
    <h2>ลงทะเบียนบัตรรับพัสดุ</h2>
    <p>กรอกข้อมูลของคุณเพื่อสร้างบัตรรับพัสดุ</p>
    <div class="field-label">ระบุรหัสพนักงาน</div>
    <input id="regId" type="text" placeholder="THXXXXXX" autocomplete="off" style="text-transform:uppercase;">
    <div class="field-label">ชื่อ-นามสกุล</div>
    <input id="regName" type="text" placeholder="เช่น สมชาย ใจดี" autocomplete="off">
    <div class="field-label">ชื่อภาษาอังกฤษ (ถ้ามี — ช่วยให้จับคู่พัสดุแม่นขึ้น)</div>
    <input id="regNameEn" type="text" placeholder="e.g. Somchai Jaidee" autocomplete="off">
    <div class="field-label">แผนก (ไม่บังคับ)</div>
    <input id="regDept" type="text" placeholder="เช่น คลังสินค้า" autocomplete="off">
    <button class="btn" onclick="submitRegister()">ลงทะเบียน</button>
    <div id="regError" style="color:#c00;font-size:13px;margin-top:10px;text-align:left;"></div>
  </div>

  <!-- หน้าบัตร QR -->
  <div id="cardView" class="card" style="display:none;">
    <h2>บัตรรับพัสดุ</h2>
    <div id="employeeInfo"></div>
    <div id="qrcode"></div>
    <p class="subtext">แสดง QR นี้ให้ รปภ. สแกนตอนมารับพัสดุ</p>
    <div id="myParcels"></div>
  </div>

  <script>
    window.onerror = function (message, source, lineno) {
      showError('JavaScript Error: ' + message + ' (บรรทัด ' + lineno + ')');
      return false;
    };
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    // =====================================================
    // ⚙️ ตั้งค่า 2 บรรทัดนี้ให้ตรงกับของคุณ
    // =====================================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbwl-8PAclZXbNUMYJlesEa1gxM1wztjhun3DmXnXug4tZsjqb5couI4VRIeGIeC0O2g/exec'; // /exec URL ของ Web App
    const LIFF_ID = '2011331495-UyEGbllS';                              // LIFF ID ของหน้า Card
    // =====================================================

    let currentProfile = null;
    let idToken = null;

    // ---------- JSONP helper ----------
    function api(action, params) {
      return new Promise(function (resolve, reject) {
        const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
        const s = document.createElement('script');
        const timer = setTimeout(function () { cleanup(); reject(new Error('API timeout')); }, 20000);
        function cleanup() { clearTimeout(timer); delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); }
        window[cb] = function (res) { cleanup(); resolve(res); };
        const merged = Object.assign({}, params || {});
        if (idToken) merged.idToken = idToken;
        const qs = Object.keys(merged).map(function (k) {
          return encodeURIComponent(k) + '=' + encodeURIComponent(merged[k]);
        }).join('&');
        s.src = API_URL + '?action=' + encodeURIComponent(action) + (qs ? '&' + qs : '') + '&callback=' + cb;
        s.onerror = function () { cleanup(); reject(new Error('เรียก API ไม่สำเร็จ')); };
        document.body.appendChild(s);
      });
    }

    window.addEventListener('load', startApp);

    async function startApp() {
      try {
        updateLoading('กำลังตรวจสอบ LIFF SDK...');
        if (typeof liff === 'undefined') throw new Error('โหลด LIFF SDK ไม่สำเร็จ');
        if (!LIFF_ID || LIFF_ID.indexOf('XXXX') !== -1) throw new Error('ยังไม่ได้ใส่ LIFF_ID ในไฟล์ card.html');
        if (!API_URL || API_URL.indexOf('XXXX') !== -1) throw new Error('ยังไม่ได้ใส่ API_URL ในไฟล์ card.html');

        updateDebug('LIFF ID: ' + LIFF_ID);
        updateLoading('กำลังเชื่อมต่อ LINE...');

        await liff.init({ liffId: LIFF_ID });
        updateDebug('inClient=' + liff.isInClient() + ' | loggedIn=' + liff.isLoggedIn());

        if (!liff.isLoggedIn()) { showLoginButton(); return; }

        idToken = liff.getIDToken();

        updateLoading('กำลังอ่านข้อมูล LINE...');
        currentProfile = await liff.getProfile();
        if (!currentProfile || !currentProfile.userId) throw new Error('ไม่สามารถอ่าน LINE Profile ได้');

        updateDebug('LINE user: ' + currentProfile.displayName);
        updateLoading('กำลังตรวจสอบการลงทะเบียน...');

        const existing = await api('checkRegistration', { lineUserId: currentProfile.userId });
        onRegistrationChecked(existing);

      } catch (err) {
        showError('LIFF Error: ' + getErrorMessage(err));
      }
    }

    function onRegistrationChecked(existing) {
      hideLoading();
      if (existing) { showCard(existing); return; }
      // ยังไม่เคยลงทะเบียน -> โชว์ฟอร์ม + เติมชื่อจาก LINE ให้เป็นค่าเริ่มต้น
      document.getElementById('registerView').style.display = 'block';
      const nameEl = document.getElementById('regName');
      if (currentProfile && currentProfile.displayName && !nameEl.value) {
        nameEl.value = currentProfile.displayName;
      }
      document.getElementById('regId').focus();
    }

    // ---------- SELF REGISTER ----------
    function submitRegister() {
      const employeeId = document.getElementById('regId').value.trim().toUpperCase();
      const name = document.getElementById('regName').value.trim();
      const nameEn = document.getElementById('regNameEn').value.trim();
      const dept = document.getElementById('regDept').value.trim();
      const errEl = document.getElementById('regError');
      errEl.textContent = '';

      if (!employeeId) { errEl.textContent = 'กรุณาระบุรหัสพนักงาน'; return; }
      if (!/^TH[A-Z0-9]{6}$/.test(employeeId)) {
        errEl.textContent = 'รหัสพนักงานต้องเป็นรูปแบบ TH ตามด้วยอักขระ 6 ตัว (เช่น TH123456)';
        return;
      }
      if (!name) { errEl.textContent = 'กรุณากรอกชื่อ-นามสกุล'; return; }
      if (!currentProfile || !currentProfile.userId) {
        showError('ไม่พบข้อมูล LINE Profile กรุณาเปิดหน้าใหม่อีกครั้ง'); return;
      }

      document.getElementById('registerView').style.display = 'none';
      showLoading('กำลังลงทะเบียน...');

      api('registerNewEmployee', {
        employeeId: employeeId,
        name: name,
        englishName: nameEn,
        department: dept,
        lineUserId: currentProfile.userId,
        displayName: currentProfile.displayName || ''
      })
        .then(onRegisterResult)
        .catch(function (err) { showError('ลงทะเบียนไม่สำเร็จ: ' + getErrorMessage(err)); });
    }

    function onRegisterResult(result) {
      hideLoading();
      if (result && result.success) { showCard(result); return; }
      document.getElementById('registerView').style.display = 'block';
      document.getElementById('regError').textContent =
        (result && result.message) ? result.message : 'ลงทะเบียนไม่สำเร็จ';
    }

    // ---------- QR CARD ----------
    function showCard(info) {
      hideLoading();
      document.getElementById('registerView').style.display = 'none';
      document.getElementById('cardView').style.display = 'block';
      document.getElementById('employeeInfo').innerHTML =
        '<p><b>' + escapeHtml(info.name) + '</b><br>' + escapeHtml(info.department || '') + '</p>' +
        (info.waitingCount > 0
          ? '<p style="color:#06c755;font-weight:600;">🎉 มีพัสดุรออยู่ ' + info.waitingCount + ' ชิ้น</p>'
          : '');

      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      if (typeof QRCode === 'undefined') { showError('โหลด QR Code library ไม่สำเร็จ'); return; }
      new QRCode(qrContainer, {
        text: String(info.employeeId), width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M
      });

      loadMyParcels();
    }

    function loadMyParcels() {
      const box = document.getElementById('myParcels');
      if (!box) return;
      box.innerHTML = '<p class="subtext" style="margin-top:14px;">กำลังโหลดพัสดุที่รออยู่...</p>';
      api('getMyWaitingParcels', {})
        .then(function (res) {
          if (!res || !res.parcels || !res.parcels.length) {
            box.innerHTML = '<p class="subtext" style="margin-top:14px;">ไม่มีพัสดุที่รออยู่</p>';
            return;
          }
          let html = '<div style="text-align:left;margin-top:16px;font-weight:600;">พัสดุที่รออยู่ (' + res.parcels.length + ')</div>';
          res.parcels.forEach(function (p) {
            const site = p.site ? (' · 📍' + p.site) : '';
            html += '<div style="text-align:left;border:1px solid #eee;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:13px;color:#444;">' +
              escapeHtml((p.courier || '-') + ' · ' + (p.trackingNumber || '-') + site) + '</div>';
          });
          box.innerHTML = html;
        })
        .catch(function () { box.innerHTML = ''; });
    }

    // ---------- UI HELPERS ----------
    function updateLoading(m) { const el = document.getElementById('loadingText'); if (el) el.textContent = m; }
    function showLoading(m) {
      const el = document.getElementById('loading');
      el.style.display = 'block';
      el.innerHTML = '<div class="loading-spinner"></div><div id="loadingText"></div><div id="debugInfo" class="debug"></div>';
      updateLoading(m);
    }
    function hideLoading() { const el = document.getElementById('loading'); if (el) el.style.display = 'none'; }
    function updateDebug(m) { const el = document.getElementById('debugInfo'); if (el) el.textContent = m; }
    function showLoginButton() {
      const el = document.getElementById('loading');
      el.style.display = 'block';
      el.innerHTML = '<p>ต้องเข้าสู่ระบบ LINE ก่อนใช้งาน</p>' +
                     '<button class="btn" onclick="liff.login()">เข้าสู่ระบบด้วย LINE</button>';
    }
    function showError(err) {
      const el = document.getElementById('loading');
      el.style.display = 'block';
      el.innerHTML = '<span class="error"><b>เกิดข้อผิดพลาด</b><br><br>' + escapeHtml(getErrorMessage(err)) + '</span>';
    }
    function getErrorMessage(err) { if (!err) return 'Unknown error'; if (err.message) return err.message; return String(err); }
    function escapeHtml(v) {
      if (v === null || v === undefined) return '';
      return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
